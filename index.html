<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>Eroğlu Motors</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:#f5f7fa;color:#172033}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}.h{display:none}button{border:0;border-radius:10px;padding:10px 13px;background:#2384e8;color:#fff;font-weight:700}button.s{background:#eef5fb;color:#155b93;border:1px solid #cfe0f2}input{width:100%;padding:11px;border:1px solid #cfd8e3;border-radius:10px;margin:5px 0 10px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px;color:#1769aa}small{color:#64748b}pre{white-space:pre-wrap;overflow:auto}</style></head>
<body><div class="top"><div><b>Eroğlu Motors</b><br><small>Web İş Yönetimi</small></div><button id="out" class="s h" onclick="logout()">Çıkış</button></div><div class="wrap"><div id="dev" class="card h"><h3>Cihaz Onayı</h3><p id="dm"></p><button onclick="requestDevice()">Onay İste</button></div><div id="login" class="card h"><h3>Giriş</h3><input id="u" placeholder="Kullanıcı adı"><input id="p" type="password" placeholder="Şifre"><button onclick="login()">Giriş</button><p id="lm"></p></div><div id="app" class="h"><div id="nav" class="nav"></div><div id="view"></div></div></div>
<script>
const API="https://jbwybaebnbniktfwaoqv.supabase.co/functions/v1/eroglu-api",$=id=>document.getElementById(id);let D=localStorage.eroglu_device_id||("web-"+crypto.randomUUID());localStorage.eroglu_device_id=D;let T=localStorage.eroglu_device_token||"",S=sessionStorage.eroglu_session||"";
async function call(action,data={}){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,device_id:D,device_token:T,session_token:S,...data})});const j=await r.json().catch(()=>({error:"invalid_response"}));if(!r.ok)throw new Error(j.error||"Hata");return j}
async function boot(){["dev","login","app","out"].forEach(x=>$(x).classList.add("h"));if(!T){$("dev").classList.remove("h");$("dm").textContent="Bu cihaz henüz kayıtlı değil.";return}try{const z=await call("device_status");if(z.status!=="active"){$("dev").classList.remove("h");$("dm").textContent=z.status==="revoked"?"Bu cihazın erişimi iptal edilmiş.":"Yönetici onayı bekleniyor.";setTimeout(boot,5000);return}if(!S){$("login").classList.remove("h");return}const b=await call("bootstrap");$("app").classList.remove("h");$("out").classList.remove("h");$("nav").innerHTML=b.modules.map(m=>`<button class="s" onclick="openM('${m}')">${m}</button>`).join("");dash()}catch(e){$("dev").classList.remove("h");$("dm").textContent=e.message}}
async function requestDevice(){try{const x=await call("device_request",{device_name:navigator.platform||"Web"});T=x.device_token;localStorage.eroglu_device_token=T;boot()}catch(e){$("dm").textContent=e.message}}
async function login(){try{const x=await call("login",{username:$("u").value,password:$("p").value});S=x.session_token;sessionStorage.eroglu_session=S;boot()}catch(e){$("lm").textContent="Giriş başarısız"}}
async function logout(){try{await call("logout")}catch(e){}S="";sessionStorage.removeItem("eroglu_session");boot()}
async function dash(){const x=await call("dashboard");$("view").innerHTML='<div class="grid">'+Object.entries(x.stats).map(([k,v])=>`<div class="kpi">${k}<b>${v}</b></div>`).join("")+'</div><div class="card"><h3>Uyarılar</h3>'+(x.alerts?.length?x.alerts.map(a=>`<div>${a}</div>`).join(""):"Kritik uyarı yok.")+"</div>"}
async function openM(m){if(m==="dashboard")return dash();if(m==="finance")return finance();if(m==="assistant")return assist();const x=await call("list",{table:m});$("view").innerHTML=`<div class="card"><h3>${m}</h3><pre>${JSON.stringify(x.rows,null,2)}</pre></div>`}
async function finance(){const x=await call("finance");$("view").innerHTML='<div class="grid">'+Object.entries(x.summary).map(([k,v])=>`<div class="kpi">${k}<b>${v}</b></div>`).join("")+"</div>"}
async function assist(){const x=await call("assistant");$("view").innerHTML='<div class="card"><h3>Eroğlu Asistan</h3>'+x.lines.map(a=>`<p>${a}</p>`).join("")+"</div>"}
boot();
</script></body></html>
